<svg xmlns="http://www.w3.org/2000/svg" viewBox="175 55 150 270" width="100%" height="100%">
  <defs>
    <path id="blade" d="M 0,-115 L 18,-26 L 0,0 L -36,-36 Z" />
    <g id="star">
      <use href="#blade" />
      <use href="#blade" transform="rotate(90)" />
      <use href="#blade" transform="rotate(180)" />
      <use href="#blade" transform="rotate(270)" />
    </g>
    <mask id="ring-cutout" maskUnits="userSpaceOnUse" x="175" y="55" width="150" height="270">
      <rect x="175" y="55" width="150" height="270" fill="white" />
      <use href="#star" transform="translate(250, 190)" fill="black" stroke="black" stroke-width="11" stroke-linejoin="miter" stroke-miterlimit="10" />
    </mask>
  </defs>
  <g mask="url(#ring-cutout)">
    <g transform="translate(250, 190)">
      <circle cx="0" cy="0" r="85" fill="none" stroke="#c5d4e3" stroke-width="16" />
      <circle cx="0" cy="0" r="53" fill="none" stroke="#f4f7fa" stroke-width="16" />
    </g>
  </g>
  <g transform="translate(250, 190)">
    <use href="#star" fill="#f4f7fa" />
  </g>
</svg>
